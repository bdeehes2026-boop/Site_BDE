<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portail BDE EHES</title>
  <style>
    :root {
      --primary: #800020; /* Bordeaux */
      --secondary: #D4AF37; /* Or */
      --bg: #f4f6f9;
      --text: #333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
    }
    header {
      background-color: var(--primary);
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    header img {
      height: 45px;
      margin-right: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-top: 4px solid var(--primary);
    }
    h2 {
      color: var(--primary);
      margin-top: 0;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #600018;
    }
    .btn-gold {
      background-color: var(--secondary);
      color: #333;
    }
    .btn-gold:hover {
      background-color: #c09e2e;
    }
    .hidden {
      display: none;
    }
    .stat-box {
      display: inline-block;
      width: 48%;
      background: #f0f0f0;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .stat-number {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
    }
    .feed-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .feed-item:last-child {
      border-bottom: none;
    }
    .feed-date {
      font-size: 0.8rem;
      color: #777;
    }
    .drive-link {
      display: inline-block;
      margin-top: 5px;
      padding: 6px 12px;
      background-color: var(--secondary);
      color: #000;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="logo_ehes.png" alt="EHES" onerror="this.style.display='none'">
      <img src="logo_bde.png" alt="BDE" onerror="this.style.display='none'">
      <h1 style="font-size: 1.2rem; margin: 0;">BDE EHES</h1>
    </div>
    <div id="userStatus"></div>
  </header>

  <div class="container">

    <!-- FORMULAIRE AUTHENTIFICATION (INSCRIPTION / CONNEXION) -->
    <div id="authSection" class="card">
      <h2 id="authTitle">Connexion Étudiant</h2>
      
      <form id="authForm">
        <div id="registerFields" class="hidden">
          <input type="text" id="authName" placeholder="Nom complet">
          <select id="authLevel">
            <option value="L1">Licence 1 (L1)</option>
            <option value="L2">Licence 2 (L2)</option>
            <option value="L3">Licence 3 (L3)</option>
            <option value="M1">Master 1 (M1)</option>
            <option value="M2">Master 2 (M2)</option>
          </select>
        </div>

        <input type="email" id="authEmail" placeholder="Adresse Email" required>
        <input type="password" id="authPassword" placeholder="Mot de passe" required>
        
        <button type="submit" id="authSubmitBtn">Se connecter</button>
      </form>

      <p style="text-align: center; margin-top: 15px;">
        <span id="toggleAuthText">Pas encore de compte ?</span>
        <a href="#" id="toggleAuthLink" style="color: var(--primary); font-weight: bold;">S'inscrire</a>
      </p>
    </div>

    <!-- ESPACE ETUDIANT (Visible une fois connecté) -->
    <div id="studentSection" class="card hidden">
      <h2>Espace Étudiant (<span id="userLevelDisplay"></span>)</h2>
      <p>Bienvenue, <strong id="userNameDisplay"></strong> !</p>
      
      <h3>Vos Cours & TDs</h3>
      <div id="coursesList">
        <!-- Les cours accessibles selon le niveau s'afficheront ici -->
      </div>

      <hr style="margin: 20px 0;">

      <h3>Annonces de la semaine</h3>
      <div id="announcementsList">
        <!-- Les publications datant de moins de 7 jours s'affichent ici -->
      </div>

      <button id="logoutBtn" style="background-color: #555; margin-top: 20px;">Se déconnecter</button>
    </div>

    <!-- PANNEAU D'ADMINISTRATION -->
    <div class="card">
      <h2>Administration BDE</h2>
      <div id="adminAuth">
        <input type="password" id="adminPassInput" placeholder="Mot de passe Administrateur">
        <button id="adminLoginBtn" class="btn-gold">Accéder au Panneau Admin</button>
      </div>

      <div id="adminPanel" class="hidden">
        <h3>Statistiques de la plateforme</h3>
        <div class="stat-box">
          <div class="stat-number" id="statInscrits">0</div>
          Inscrits au total
        </div>
        <div class="stat-box">
          <div class="stat-number" id="statConnectes">0</div>
          Connexions aujourd'hui
        </div>

        <h3>Publier une annonce / vidéo</h3>
        <input type="text" id="postTitle" placeholder="Titre de l'annonce">
        <textarea id="postContent" placeholder="Contenu du message"></textarea>
        <input type="url" id="postMedia" placeholder="Lien d'une vidéo ou image (optionnel)">
        <button id="publishPostBtn">Publier (Visible 7 jours)</button>

        <h3>Ajouter un cours / TD</h3>
        <select id="courseLevel">
          <option value="L1">Licence 1 (L1)</option>
          <option value="L2">Licence 2 (L2)</option>
          <option value="L3">Licence 3 (L3)</option>
          <option value="M1">Master 1 (M1)</option>
          <option value="M2">Master 2 (M2)</option>
        </select>
        <input type="text" id="courseTitle" placeholder="Titre du cours / TD">
        <input type="url" id="courseDriveUrl" placeholder="Lien Google Drive du cours">
        <button id="publishCourseBtn" class="btn-gold">Ajouter le lien du cours</button>
      </div>
    </div>

  </div>

  <script>
    // --- INITIALISATION DES DONNEES LOCALES ---
    let users = JSON.parse(localStorage.getItem('bde_users')) || [];
    let posts = JSON.parse(localStorage.getItem('bde_posts')) || [];
    let courses = JSON.parse(localStorage.getItem('bde_courses')) || [];
    let logins = JSON.parse(localStorage.getItem('bde_logins')) || [];
    let currentUser = JSON.parse(localStorage.getItem('bde_current_user')) || null;

    let isRegisterMode = false;

    // Nettoyage automatique des posts de plus d'une semaine (7 jours = 604800000 ms)
    const ONE_WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    const now = Date.now();
    posts = posts.filter(p => (now - p.timestamp) < ONE_WEEK_MS);
    localStorage.setItem('bde_posts', JSON.stringify(posts));

    // --- ELEMENTS DU DOM ---
    const authSection = document.getElementById('authSection');
    const authForm = document.getElementById('authForm');
    const authTitle = document.getElementById('authTitle');
    const registerFields = document.getElementById('registerFields');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const toggleAuthLink = document.getElementById('toggleAuthLink');
    const toggleAuthText = document.getElementById('toggleAuthText');

    const studentSection = document.getElementById('studentSection');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const userLevelDisplay = document.getElementById('userLevelDisplay');
    const coursesList = document.getElementById('coursesList');
    const announcementsList = document.getElementById('announcementsList');
    const logoutBtn = document.getElementById('logoutBtn');

    const adminAuth = document.getElementById('adminAuth');
    const adminPanel = document.getElementById('adminPanel');
    const adminPassInput = document.getElementById('adminPassInput');
    const adminLoginBtn = document.getElementById('adminLoginBtn');

    // --- GESTION CONNEXION / INSCRIPTION ---
    toggleAuthLink.addEventListener('click', (e) => {
      e.preventDefault();
      isRegisterMode = !isRegisterMode;
      if (isRegisterMode) {
        authTitle.innerText = "Inscription Étudiant";
        registerFields.classList.remove('hidden');
        authSubmitBtn.innerText = "S'inscrire";
        toggleAuthText.innerText = "Déjà un compte ?";
        toggleAuthLink.innerText = "Se connecter";
      } else {
        authTitle.innerText = "Connexion Étudiant";
        registerFields.classList.add('hidden');
        authSubmitBtn.innerText = "Se connecter";
        toggleAuthText.innerText = "Pas encore de compte ?";
        toggleAuthLink.innerText = "S'inscrire";
      }
    });

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (isRegisterMode) {
        const name = document.getElementById('authName').value.trim();
        const level = document.getElementById('authLevel').value;

        if (users.find(u => u.email === email)) {
          alert("Un compte existe déjà avec cette adresse email ! Veuillez vous connecter.");
          return;
        }

        const newUser = { name, email, password, level };
        users.push(newUser);
        localStorage.setItem('bde_users', JSON.stringify(users));
        
        currentUser = newUser;
        localStorage.setItem('bde_current_user', JSON.stringify(currentUser));
        registerLogin();
        checkUserSession();
      } else {
        const user = users.find(u => u.email === email && u.password === password);
        if (user) {
          currentUser = user;
          localStorage.setItem('bde_current_user', JSON.stringify(currentUser));
          registerLogin();
          checkUserSession();
        } else {
          alert("Email ou mot de passe incorrect.");
        }
      }
    });

    function registerLogin() {
      const today = new Date().toISOString().split('T')[0];
      logins.push({ email: currentUser.email, date: today });
      localStorage.setItem('bde_logins', JSON.stringify(logins));
    }

    logoutBtn.addEventListener('click', () => {
      currentUser = null;
      localStorage.removeItem('bde_current_user');
      checkUserSession();
    });

    function checkUserSession() {
      if (currentUser) {
        authSection.classList.add('hidden');
        studentSection.classList.remove('hidden');
        userNameDisplay.innerText = currentUser.name;
        userLevelDisplay.innerText = currentUser.level;
        renderStudentContent();
      } else {
        authSection.classList.remove('hidden');
        studentSection.classList.add('hidden');
      }
    }

    // --- CONVERSION GOOGLE DRIVE POUR TELECHARGEMENT ---
    function formatDriveLink(url) {
      if (url.includes('drive.google.com') && url.includes('/d/')) {
        const fileId = url.split('/d/')[1].split('/')[0];
        return `https://drive.google.com/uc?export=download&id=${fileId}`;
      }
      return url;
    }

    // --- AFFICHAGE CONTENU ETUDIANT ---
    function renderStudentContent() {
      // 1. Filtrer les cours accessibles UNIQUEMENT au niveau de l'étudiant
      const userCourses = courses.filter(c => c.level === currentUser.level);
      coursesList.innerHTML = userCourses.length ? '' : '<p>Aucun cours disponible pour le moment.</p>';
      userCourses.forEach(c => {
        const downloadUrl = formatDriveLink(c.url);
        coursesList.innerHTML += `
          <div style="background:#f9f9f9; padding:10px; margin-bottom:8px; border-left:3px solid var(--secondary);">
            <strong>${c.title}</strong><br>
            <a href="${downloadUrl}" class="drive-link" target="_blank" download>Télécharger le fichier (Drive)</a>
          </div>
        `;
      });

      // 2. Afficher les annonces actives (moins de 7 jours)
      announcementsList.innerHTML = posts.length ? '' : '<p>Aucune annonce cette semaine.</p>';
      posts.forEach(p => {
        const dateStr = new Date(p.timestamp).toLocaleDateString();
        announcementsList.innerHTML += `
          <div class="feed-item">
            <strong>${p.title}</strong> <span class="feed-date">(${dateStr})</span>
            <p>${p.content}</p>
            ${p.media ? `<p><a href="${p.media}" target="_blank" style="color:var(--primary)">Voir la pièce jointe / vidéo</a></p>` : ''}
          </div>
        `;
      });
    }

    // --- ESPACE ADMIN & STATISTIQUES ---
    adminLoginBtn.addEventListener('click', () => {
      const pass = adminPassInput.value;
      if (pass === 'bde2026') {
        adminAuth.classList.add('hidden');
        adminPanel.classList.remove('hidden');
        loadAdminStats();
      } else {
        alert("Mot de passe incorrect.");
      }
    });

    function loadAdminStats() {
      document.getElementById('statInscrits').innerText = users.length;
      
      const today = new Date().toISOString().split('T')[0];
      const todayLogins = logins.filter(l => l.date === today).length;
      document.getElementById('statConnectes').innerText = todayLogins;
    }

    // Ajouter une annonce
    document.getElementById('publishPostBtn').addEventListener('click', () => {
      const title = document.getElementById('postTitle').value.trim();
      const content = document.getElementById('postContent').value.trim();
      const media = document.getElementById('postMedia').value.trim();

      if (!title || !content) {
        alert("Veuillez remplir le titre et le contenu.");
        return;
      }

      posts.unshift({ title, content, media, timestamp: Date.now() });
      localStorage.setItem('bde_posts', JSON.stringify(posts));
      alert("Annonce publiée pour 7 jours !");
      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      document.getElementById('postMedia').value = '';
      if (currentUser) renderStudentContent();
    });

    // Ajouter un cours
    document.getElementById('publishCourseBtn').addEventListener('click', () => {
      const level = document.getElementById('courseLevel').value;
      const title = document.getElementById('courseTitle').value.trim();
      const url = document.getElementById('courseDriveUrl').value.trim();

      if (!title || !url) {
        alert("Veuillez remplir tous les champs.");
        return;
      }

      courses.push({ level, title, url });
      localStorage.setItem('bde_courses', JSON.stringify(courses));
      alert(`Cours ajouté pour les étudiants en ${level} !`);
      document.getElementById('courseTitle').value = '';
      document.getElementById('courseDriveUrl').value = '';
      if (currentUser) renderStudentContent();
    });

    // Vérifier la session au chargement
    checkUserSession();
  </script>
</body>
</html>
